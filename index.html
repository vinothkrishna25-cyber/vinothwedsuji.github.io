<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome </title>
 <title> G. Krishnan & P. Shankar</title>
 <title>Family Function</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e6f0ff;--card:#fff;--accent:#007bff}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
    .card{background:var(--card);padding:36px;border-radius:12px;box-shadow:0 8px 30px rgba(15,15,15,.08);max-width:720px;text-align:center}
    h1{margin:0 0 8px;font-size:36px;font-family:'Playfair Display', Georgia, serif;letter-spacing:0.6px;color:#102a43}
    .lead{font-size:20px;color:#1f2937;margin-bottom:12px}
    .welcome-note{font-style:italic;color:#334155;margin-bottom:18px;line-height:1.5}
    p{margin:0 0 16px;color:#444;font-size:18px;line-height:1.4}
    .btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 20px;border-radius:8px;border:0;cursor:pointer;font-size:16px;text-decoration:none}
    .small{color:#666;font-size:14px;margin-top:12px}
    .btn:focus{outline:3px solid rgba(0,123,255,0.25);outline-offset:3px}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="welcomeTitle">
    <h1 id="welcomeTitle">Welcome</h1>

    <p class="lead">Celebrating the family function of <strong>G. KRISHNAN VALLI</strong> &amp; <strong>P. SHANKAR PUSHPA</strong></p>

    <p class="welcome-note">We warmly invite family and friends to join us for an evening of blessings, laughter, and togetherness. Your presence is a cherished part of this celebration.</p>

    <button id="openBtn" class="btn" aria-label="Open details page">Open</button>
    <div class="small">Click Open to continue to the next page.</div>
  </main>

  <script>
    // Reliable relative navigation to the details page
    document.getElementById('openBtn').addEventListener('click', function(){
      window.location.href = 'next.html';
    });
  </script>
</body>
</html>
